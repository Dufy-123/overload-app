<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OVERLOAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121417;
    --panel:#1a1d22;
    --panel-alt:#20242a;
    --border:#2b3038;
    --text:#eceef1;
    --text-dim:#888e98;
    --text-faint:#5a606a;
    --protein:#e0473f;   /* 25kg red plate */
    --carbs:#e8b93d;     /* 15kg yellow plate */
    --fat:#3f9e5e;       /* 10kg green plate */
    --cal:#3f7fd0;       /* 20kg blue plate */
    --trend:#9d7fe0;
    --danger:#e0473f;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  .display{font-family:'Bebas Neue',sans-serif; letter-spacing:0.02em;}
  .mono{font-family:'Roboto Mono',monospace;}
  #app{display:flex; min-height:100vh;}

  /* ---- Nav ---- */
  nav{
    width:180px; flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{padding:22px 18px 14px; border-bottom:1px solid var(--border);}
  .brand .display{font-size:28px; line-height:1; color:var(--text);}
  .brand .sub{font-size:11px; color:var(--text-dim); margin-top:2px; letter-spacing:0.03em;}
  .navlist{flex:1; padding:10px 0;}
  .navitem{
    display:flex; align-items:center; gap:10px;
    padding:13px 18px; cursor:pointer; font-size:14px; font-weight:500;
    color:var(--text-dim); border-left:3px solid transparent;
    transition:background .12s, color .12s;
  }
  .navitem:hover{background:var(--panel-alt); color:var(--text);}
  .navitem.active{color:var(--text); background:var(--panel-alt); border-left-color:var(--cal);}
  .navitem .plate{width:8px; height:8px; border-radius:1px; flex-shrink:0;}
  .navfoot{padding:14px 18px; border-top:1px solid var(--border); font-size:11px; color:var(--text-faint);}

  main{flex:1; padding:28px 34px 60px; max-width:920px;}
  h1.pagehead{font-family:'Bebas Neue'; font-size:34px; letter-spacing:0.02em; margin:0 0 4px;}
  .pagesub{color:var(--text-dim); font-size:13px; margin:0 0 26px;}

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; margin-bottom:18px;
  }
  .panel-title{font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim); margin:0 0 16px; font-weight:600;}

  /* ---- Macro bars ---- */
  .macrorow{margin-bottom:16px;}
  .macrorow:last-child{margin-bottom:0;}
  .macrorow-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .macrorow-label{font-size:13px; font-weight:600; color:var(--text);}
  .macrorow-nums{font-size:13px; color:var(--text-dim);}
  .macrorow-nums b{color:var(--text); font-weight:600;}
  .bartrack{height:10px; background:var(--panel-alt); border:1px solid var(--border); border-radius:2px; overflow:hidden; position:relative;}
  .barfill{height:100%; border-radius:1px; transition:width .3s ease;}

  .bigstat{display:flex; align-items:baseline; gap:10px;}
  .bigstat .num{font-family:'Bebas Neue'; font-size:52px; line-height:1;}
  .bigstat .unit{font-size:14px; color:var(--text-dim);}

  .statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:14px; margin-top:16px;}
  .statbox{background:var(--panel-alt); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px;}
  .statbox .k{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px;}
  .statbox .v{font-family:'Bebas Neue'; font-size:24px;}

  /* ---- Forms ---- */
  label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px; font-weight:500;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; background:var(--panel-alt); border:1px solid var(--border); color:var(--text);
    padding:9px 10px; border-radius:var(--radius); font-size:14px; font-family:inherit;
  }
  textarea{resize:vertical; min-height:64px;}
  input:focus, select:focus, textarea:focus{outline:1px solid var(--cal); border-color:var(--cal);}
  .fieldrow{margin-bottom:14px;}
  .fieldgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .fieldgrid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}

  button{
    font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
    border-radius:var(--radius); border:1px solid var(--border); padding:10px 16px;
    background:var(--panel-alt); color:var(--text); transition:background .12s, border-color .12s;
  }
  button:hover{background:#282d34;}
  button.primary{background:var(--cal); border-color:var(--cal); color:#fff;}
  button.primary:hover{background:#3670bb;}
  button.danger{color:var(--danger); border-color:#3a2a29;}
  button.danger:hover{background:#2a1c1c;}
  button:disabled{opacity:0.5; cursor:default;}
  button.small{padding:6px 11px; font-size:12px;}
  .btnrow{display:flex; gap:10px; margin-top:6px; flex-wrap:wrap;}

  .toggle{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim); cursor:pointer; user-select:none;}
  .toggle input{width:auto;}

  /* ---- Lists ---- */
  .logentry{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 0; border-bottom:1px solid var(--border); gap:12px;
  }
  .logentry:last-child{border-bottom:none;}
  .logentry-main{flex:1; min-width:0;}
  .logentry-name{font-size:14px; font-weight:500; color:var(--text);}
  .logentry-meta{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .logentry-macros{display:flex; gap:10px; font-size:12px; font-family:'Roboto Mono'; flex-shrink:0;}
  .m-p{color:var(--protein);} .m-c{color:var(--carbs);} .m-f{color:var(--fat);} .m-k{color:var(--text-dim);}
  .empty{color:var(--text-faint); font-size:13px; padding:14px 0; text-align:center;}

  /* ---- Analyze result card ---- */
  .analyzebox{border:1px dashed var(--border); border-radius:var(--radius); padding:16px; margin-top:14px;}
  .itemline{font-size:13px; color:var(--text-dim); padding:4px 0; border-bottom:1px solid var(--border);}
  .itemline:last-of-type{border-bottom:none;}
  .loading{display:flex; align-items:center; gap:10px; color:var(--text-dim); font-size:13px; padding:10px 0;}
  .spinner{width:14px; height:14px; border:2px solid var(--border); border-top-color:var(--cal); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .errbox{color:var(--danger); font-size:13px; background:#241a1a; border:1px solid #3a2a29; padding:10px 12px; border-radius:var(--radius); margin-top:10px;}

  .notebox{font-size:12.5px; color:var(--text-dim); background:var(--panel-alt); border-left:2px solid var(--carbs); padding:10px 13px; border-radius:2px; line-height:1.5; margin-bottom:18px;}

  svg.chart{width:100%; height:160px; display:block;}
  .exrow{border:1px solid var(--border); border-radius:var(--radius); padding:12px; margin-bottom:10px; background:var(--panel-alt);}
  .exrow-head{display:flex; justify-content:space-between; gap:10px; margin-bottom:8px;}

  ::placeholder{color:var(--text-faint);}

  table.trendtable{width:100%; border-collapse:collapse; font-size:12px;}
  table.trendtable th{padding:6px 10px 6px 0; text-align:left; color:var(--text-dim); border-bottom:1px solid var(--border); font-weight:600;}
  table.trendtable td{padding:9px 10px 9px 0; border-bottom:1px solid var(--border); white-space:nowrap;}
  .trendwrap{overflow-x:auto;}

  @media (max-width:720px){
    #app{flex-direction:column;}
    nav{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto;}
    .brand{display:none;}
    .navlist{display:flex; padding:0;}
    .navitem{border-left:none; border-bottom:3px solid transparent; white-space:nowrap;}
    .navitem.active{border-bottom-color:var(--cal);}
    .navfoot{display:none;}
    main{padding:18px 16px 50px;}
    .fieldgrid, .fieldgrid3{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== LOCAL STORAGE ADAPTER ===================== */
const storage = {
  async get(key){
    try{ const v = localStorage.getItem('overload:'+key); return v===null ? null : {value:v}; }
    catch(e){ return null; }
  },
  async set(key, value){
    try{ localStorage.setItem('overload:'+key, value); }catch(e){ /* storage unavailable / full */ }
  }
};

/* ===================== STATE ===================== */
let STATE = {
  tab: 'dashboard',
  profile: null,
  foodLogs: [],
  weightLogs: [],
  workoutLogs: [],
  loaded: false,
  analyzeResult: null,
  analyzeLoading: false,
  analyzeError: null,
  editingFoodId: null,
  foodViewDate: null, // date string being viewed/logged on the Log Food tab; defaults to today
  foodManualMode: null, // whether the Log Food "New entry" form shows manual macro fields vs. the AI description field; defaults to true
};

const DEFAULT_PROFILE = {
  sex: 'male', age: 25, heightFt: 5, heightIn: 10, weightLbs: 185,
  activity: 'moderate', experience: 'advanced', phase: 'bulk',
  surplusPct: 7.5, deficitPct: 20, proteinPerLb: 0.85, fatPct: 25
};

const ACTIVITY_MULT = {
  sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725, veryactive: 1.9
};
const ACTIVITY_LABEL = {
  sedentary: 'Sedentary (desk job, little exercise outside lifting)',
  light: 'Light (on your feet some of the day)',
  moderate: 'Moderate (on your feet most of the day / active job)',
  active: 'Active (physical job)',
  veryactive: 'Very active (physical job + high daily movement)'
};

/* Rate-of-gain bands (% bodyweight per month) — beginner/intermediate figures are
   Jeff Nippard's, from "How To Bulk Like A Pro". The advanced band is not a number
   he stated directly; it's a reasonable extrapolation of his framework for
   longer-trained lifters, so treat it as an estimate. */
const RATE_BANDS = {
  beginner: { min: 1, max: 2, label: 'Beginner (< 1yr training)' },
  intermediate: { min: 0.5, max: 1, label: 'Intermediate (1–3yrs)' },
  advanced: { min: 0.25, max: 0.5, label: 'Advanced (3+ yrs, estimated)' }
};
/* Mini-cut target: ~20-25% deficit, aiming for roughly 0.5-1% bodyweight loss/week
   over 4-6 weeks, per Nippard's approach to trimming fat gained on a long bulk. */
const MINICUT_BAND = { min: 0.5, max: 1 };

/* MET values (Compendium of Physical Activities) used to estimate calories burned
   from resistance-training sessions when the user hasn't overridden the number. */
const MET_VALUES = { moderate: 3.5, vigorous: 6.0, circuit: 8.0 };
const MET_LABELS = {
  moderate: 'Moderate lifting (steady pace, rest between sets)',
  vigorous: 'Vigorous lifting (heavy effort, short rest)',
  circuit: 'Circuit / conditioning (minimal rest, continuous)'
};

function todayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(n){ return Math.round(n).toLocaleString(); }
function estimateWorkoutCalories(weightLbs, met, minutes){
  const kg = weightLbs * 0.453592;
  return (met * 3.5 * kg / 200) * minutes;
}

/* ===================== STORAGE ===================== */
async function loadAll(){
  const [p, f, w, wo] = await Promise.all([
    safeGet('profile'), safeGet('foodLogs'), safeGet('weightLogs'), safeGet('workoutLogs')
  ]);
  STATE.profile = p ? {...DEFAULT_PROFILE, ...JSON.parse(p)} : {...DEFAULT_PROFILE};
  // migrate old flat-kcal-surplus / g-per-lb-fat profiles to the new % based fields
  if(STATE.profile.surplusPct === undefined && STATE.profile.surplus !== undefined){
    const kg = STATE.profile.weightLbs*0.453592, cm=(STATE.profile.heightFt*12+STATE.profile.heightIn)*2.54;
    let bmr = 10*kg+6.25*cm-5*STATE.profile.age + (STATE.profile.sex==='male'?5:-161);
    const tdee = bmr*ACTIVITY_MULT[STATE.profile.activity];
    STATE.profile.surplusPct = Math.round((STATE.profile.surplus/tdee)*1000)/10;
  }
  if(STATE.profile.fatPct === undefined && STATE.profile.fatPerLb !== undefined){
    STATE.profile.fatPct = 25; // fall back to Nippard's mid-range default
  }
  await saveProfile();
  STATE.foodLogs = f ? JSON.parse(f) : [];
  STATE.weightLogs = w ? JSON.parse(w) : [];
  STATE.workoutLogs = wo ? JSON.parse(wo) : [];
  STATE.loaded = true;
}
async function safeGet(key){
  try{ const r = await storage.get(key); return r ? r.value : null; }
  catch(e){ return null; }
}
async function saveProfile(){ await storage.set('profile', JSON.stringify(STATE.profile)); }
async function saveFoodLogs(){ await storage.set('foodLogs', JSON.stringify(STATE.foodLogs)); }
async function saveWeightLogs(){ await storage.set('weightLogs', JSON.stringify(STATE.weightLogs)); }
async function saveWorkoutLogs(){ await storage.set('workoutLogs', JSON.stringify(STATE.workoutLogs)); }

/* ===================== TARGET CALCS ===================== */
function computeTargets(profile){
  const kg = profile.weightLbs * 0.453592;
  const cm = (profile.heightFt*12 + profile.heightIn) * 2.54;
  let bmr = 10*kg + 6.25*cm - 5*profile.age;
  bmr += (profile.sex === 'male') ? 5 : -161;
  const tdee = bmr * ACTIVITY_MULT[profile.activity];
  const isMinicut = profile.phase === 'minicut';
  const calories = isMinicut
    ? tdee * (1 - Number(profile.deficitPct)/100)
    : tdee * (1 + Number(profile.surplusPct)/100);
  const proteinG = profile.weightLbs * Number(profile.proteinPerLb);
  const fatG = (calories * Number(profile.fatPct)/100) / 9;
  const remaining = calories - proteinG*4 - fatG*9;
  const carbsG = Math.max(0, remaining/4);
  return { bmr, tdee, calories, proteinG, fatG, carbsG, isMinicut };
}

/* Actual rate of weight change from logged entries, using the most recent ~35-day
   window (or everything available if the log is shorter). */
function computeRateOfGain(){
  const logs = STATE.weightLogs.slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(logs.length < 2) return null;
  const last = logs[logs.length-1];
  const lastDate = new Date(last.date);
  let ref = logs[0];
  for(const l of logs){
    const daysAgo = (lastDate - new Date(l.date)) / 86400000;
    if(daysAgo <= 35){ ref = l; break; }
  }
  const days = (lastDate - new Date(ref.date)) / 86400000;
  if(days < 6) return null;
  const pctChange = ((last.weightLbs - ref.weightLbs) / ref.weightLbs) * 100;
  return {
    pctPerMonth: pctChange * (30/days),
    pctPerWeek: pctChange * (7/days),
    days: Math.round(days), from: ref, to: last
  };
}
function rateStatus(rate, profile){
  if(profile.phase === 'minicut'){
    const band = MINICUT_BAND;
    const weeklyLoss = -rate.pctPerWeek; // expect negative pctPerWeek during a cut
    if(weeklyLoss < band.min) return { tone:'low', text:`Losing ${weeklyLoss.toFixed(2)}%/week — slower than the ${band.min}–${band.max}%/week mini-cut target. Consider a slightly larger deficit.` };
    if(weeklyLoss > band.max) return { tone:'high', text:`Losing ${weeklyLoss.toFixed(2)}%/week — faster than the ${band.min}–${band.max}%/week target, which risks muscle loss. Consider easing the deficit.` };
    return { tone:'ok', text:`Losing ${weeklyLoss.toFixed(2)}%/week — right in the ${band.min}–${band.max}%/week mini-cut range.` };
  }
  const band = RATE_BANDS[profile.experience];
  if(rate.pctPerMonth < band.min) return { tone:'low', text:`Gaining ${rate.pctPerMonth.toFixed(2)}%/month — below the ${band.min}–${band.max}% target for ${profile.experience} lifters. Consider bumping the surplus 1–2%.` };
  if(rate.pctPerMonth > band.max) return { tone:'high', text:`Gaining ${rate.pctPerMonth.toFixed(2)}%/month — above the ${band.min}–${band.max}% target, which likely means more fat gain than necessary. Consider trimming the surplus 1–2%.` };
  return { tone:'ok', text:`Gaining ${rate.pctPerMonth.toFixed(2)}%/month — right in the ${band.min}–${band.max}% target range for ${profile.experience} lifters.` };
}

function todaysTotals(){
  const t = todayStr();
  const entries = STATE.foodLogs.filter(e => e.date === t);
  return entries.reduce((acc,e)=>({
    calories: acc.calories + e.totals.calories,
    protein: acc.protein + e.totals.protein_g,
    carbs: acc.carbs + e.totals.carbs_g,
    fat: acc.fat + e.totals.fat_g
  }), {calories:0, protein:0, carbs:0, fat:0});
}
function todaysCaloriesBurned(){
  const t = todayStr();
  return STATE.workoutLogs.filter(w=>w.date===t).reduce((a,w)=>a+(w.caloriesBurned||0),0);
}

/* ===================== RENDER SHELL ===================== */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <nav>
      <div class="brand">
        <div class="display">OVERLOAD</div>
        <div class="sub">Bulk tracking log</div>
      </div>
      <div class="navlist">
        ${navItem('dashboard','Dashboard','var(--cal)')}
        ${navItem('food','Log Food','var(--protein)')}
        ${navItem('weight','Weight','var(--carbs)')}
        ${navItem('workouts','Workouts','var(--fat)')}
        ${navItem('trends','Trends','var(--trend)')}
        ${navItem('settings','Settings','#7a8090')}
      </div>
      <div class="navfoot mono">${todayStr()}</div>
    </nav>
    <main id="main"></main>
  `;
  document.querySelectorAll('.navitem').forEach(el=>{
    el.addEventListener('click', ()=>{ STATE.tab = el.dataset.tab; STATE.analyzeResult=null; STATE.analyzeError=null; STATE.editingFoodId=null; STATE.foodViewDate=null; STATE.foodManualMode=null; renderMain(); attachNavHighlight(); });
  });
  renderMain();
}
function navItem(id,label,color){
  return `<div class="navitem${STATE.tab===id?' active':''}" data-tab="${id}">
    <span class="plate" style="background:${color}"></span>${label}
  </div>`;
}
function attachNavHighlight(){
  document.querySelectorAll('.navitem').forEach(el=>{
    el.classList.toggle('active', el.dataset.tab === STATE.tab);
  });
}

function renderMain(){
  const main = document.getElementById('main');
  if(STATE.tab==='dashboard') main.innerHTML = viewDashboard();
  else if(STATE.tab==='food') main.innerHTML = viewFood();
  else if(STATE.tab==='weight') main.innerHTML = viewWeight();
  else if(STATE.tab==='workouts') main.innerHTML = viewWorkouts();
  else if(STATE.tab==='trends') main.innerHTML = viewTrends();
  else if(STATE.tab==='settings') main.innerHTML = viewSettings();
  bindTabEvents();
}

/* ===================== DASHBOARD ===================== */
function viewDashboard(){
  const targets = computeTargets(STATE.profile);
  const totals = todaysTotals();
  const burned = todaysCaloriesBurned();
  const latestWeight = STATE.weightLogs.length ? STATE.weightLogs[STATE.weightLogs.length-1] : null;
  const startWeight = STATE.weightLogs.length ? STATE.weightLogs[0].weightLbs : STATE.profile.weightLbs;
  const gained = latestWeight ? (latestWeight.weightLbs - startWeight) : 0;

  return `
    <h1 class="pagehead">Today</h1>
    <p class="pagesub">${new Date().toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'})}</p>

    <div class="panel">
      <div class="panel-title">Calories</div>
      <div class="bigstat">
        <span class="num">${fmt(totals.calories)}</span>
        <span class="unit">/ ${fmt(targets.calories)} kcal</span>
      </div>
      <div class="bartrack" style="margin-top:10px;">
        <div class="barfill" style="width:${pct(totals.calories,targets.calories)}%; background:var(--cal);"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Macros</div>
      ${macroRow('Protein', totals.protein, targets.proteinG, 'var(--protein)')}
      ${macroRow('Carbs', totals.carbs, targets.carbsG, 'var(--carbs)')}
      ${macroRow('Fat', totals.fat, targets.fatG, 'var(--fat)')}
    </div>

    <div class="panel">
      <div class="panel-title">Progress</div>
      <div class="statgrid">
        <div class="statbox"><div class="k">Current weight</div><div class="v">${latestWeight ? latestWeight.weightLbs : STATE.profile.weightLbs} lb</div></div>
        <div class="statbox"><div class="k">Since start</div><div class="v">${gained>=0?'+':''}${gained.toFixed(1)} lb</div></div>
        <div class="statbox"><div class="k">TDEE (maintenance)</div><div class="v">${fmt(targets.tdee)}</div></div>
        <div class="statbox"><div class="k">${targets.isMinicut ? 'Daily deficit' : 'Daily surplus'}</div><div class="v">${targets.isMinicut ? '−' : '+'}${fmt(Math.abs(targets.tdee - targets.calories))}</div></div>
        <div class="statbox"><div class="k">Burned (workouts)</div><div class="v">${fmt(burned)}</div></div>
      </div>
    </div>

    ${rateOfGainPanel()}

    <div class="notebox">${targets.isMinicut
      ? `Mini-cut mode: eating ${STATE.profile.deficitPct}% below maintenance. The idea (per Jeff Nippard) is a short 4–6 week trim to knock off fat gained on the bulk before going back to a surplus — not a long-term diet.`
      : `Running a ${STATE.profile.surplusPct}% surplus above maintenance — within the 5–10% range Jeff Nippard recommends in "How To Bulk Like A Pro" to build muscle without excess fat. Watch the rate-of-gain panel below more than the day-to-day number; that's the real signal of whether the surplus is sized right.`}</div>
  `;
}
function rateOfGainPanel(){
  const rate = computeRateOfGain();
  if(!rate){
    return `<div class="panel"><div class="panel-title">Rate of gain</div><div class="empty">Log weight at least twice, a week or more apart, to see your actual trend against target.</div></div>`;
  }
  const status = rateStatus(rate, STATE.profile);
  const color = status.tone === 'ok' ? 'var(--fat)' : status.tone === 'high' ? 'var(--protein)' : 'var(--carbs)';
  return `
    <div class="panel">
      <div class="panel-title">Rate of gain <span class="mono" style="font-weight:400; text-transform:none; letter-spacing:0;">(last ${rate.days} days)</span></div>
      <div class="bigstat"><span class="num" style="color:${color}">${STATE.profile.phase==='minicut' ? (-rate.pctPerWeek).toFixed(2) : rate.pctPerMonth.toFixed(2)}%</span>

async function analyzeFood(description){
  const response = await fetch('/api/analyze-food', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ description })
  });
  if(!response.ok){
    const errBody = await response.json().catch(()=>({}));
    throw new Error(errBody.error || ('server error ' + response.status));
  }
  const parsed = await response.json();
  if(!parsed.total) throw new Error('unexpected response format');
  return parsed;
}

function weightChart(logs){
  const w = 800, h = 160, pad = 24;
  const vals = logs.map(l=>l.weightLbs);
  const min = Math.min(...vals)-1, max = Math.max(...vals)+1;
  const xStep = (w-pad*2)/(logs.length-1);
  const pts = logs.map((l,i)=>{
    const x = pad + i*xStep;
    const y = h-pad - ((l.weightLbs-min)/(max-min))*(h-pad*2);
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--carbs)"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${path}" fill="none" stroke="var(--carbs)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    ${dots}
  </svg>`;
}

/* ===================== TRENDS ===================== */
function periodKeyWeek(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diff = (day===0 ? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function periodKeyMonth(dateStr){ return dateStr.slice(0,7); }

function aggregatePeriods(keyFn){
  const periods = {};
  function ensure(k){
    if(!periods[k]) periods[k] = {
      key:k, days:new Set(), calories:0, protein:0, carbs:0, fat:0,
      weightFirst:null, weightLast:null, weightFirstDate:null, weightLastDate:null,
      workouts:0, burned:0
    };
    return periods[k];
  }
  STATE.foodLogs.forEach(e=>{
    const p = ensure(keyFn(e.date));
    p.days.add(e.date);
    p.calories += e.totals.calories;
    p.protein += e.totals.protein_g;
    p.carbs += e.totals.carbs_g;
    p.fat += e.totals.fat_g;
  });
  STATE.weightLogs.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
    const p = ensure(keyFn(l.date));
    if(p.weightFirstDate===null || l.date < p.weightFirstDate){ p.weightFirst = l.weightLbs; p.weightFirstDate = l.date; }
    if(p.weightLastDate===null || l.date > p.weightLastDate){ p.weightLast = l.weightLbs; p.weightLastDate = l.date; }
  });
  STATE.workoutLogs.forEach(w=>{
    const p = ensure(keyFn(w.date));
    p.workouts += 1;
    p.burned += (w.caloriesBurned||0);
  });
  return Object.values(periods).sort((a,b)=>b.key.localeCompare(a.key));
}

function trendsTable(periods, labelFn, targets){
  if(!periods.length) return '<div class="empty">No data logged yet.</div>';
  return `
    <div class="trendwrap">
    <table class="trendtable">
      <thead><tr>
        <th>Period</th>
        <th>Days logged</th>
        <th>Avg kcal/day</th>
        <th>Avg P/C/F (g)</th>
        <th>Weight Δ</th>
        <th>Workouts</th>
        <th>Burned</th>
      </tr></thead>
      <tbody>
      ${periods.map(p=>{
        const n = p.days.size || 1;
        const avgCal = p.calories/n, avgP = p.protein/n, avgC = p.carbs/n, avgF = p.fat/n;
        const weightDelta = (p.weightFirst!==null && p.weightLast!==null) ? (p.weightLast - p.weightFirst) : null;
        return `<tr>
          <td>${labelFn(p.key)}</td>
          <td>${p.days.size}</td>
          <td class="mono">${p.days.size ? fmt(avgCal)+' / '+fmt(targets.calories) : '—'}</td>
          <td class="mono">${p.days.size ? `<span class="m-p">${fmt(avgP)}</span>/<span class="m-c">${fmt(avgC)}</span>/<span class="m-f">${fmt(avgF)}</span>` : '—'}</td>
          <td class="mono">${weightDelta!==null ? (weightDelta>=0?'+':'')+weightDelta.toFixed(1)+' lb' : '—'}</td>
          <td class="mono">${p.workouts || '—'}</td>
          <td class="mono">${p.burned ? fmt(p.burned) : '—'}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
    </div>
  `;
}

function viewTrends(){
  const targets = computeTargets(STATE.profile);
  const weekly = aggregatePeriods(periodKeyWeek).slice(0,10);
  const monthly = aggregatePeriods(periodKeyMonth);
  const weekLabel = k => {
    const d = new Date(k+'T00:00:00');
    const end = new Date(d); end.setDate(end.getDate()+6);
    return `${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}–${end.toLocaleDateString(undefined,{month:'short',day:'numeric'})}`;
  };
  const monthLabel = k => {
    const [y,m] = k.split('-');
    return new Date(Number(y), Number(m)-1, 1).toLocaleDateString(undefined,{month:'long', year:'numeric'});
  };
  return `
    <h1 class="pagehead">Trends</h1>
    <p class="pagesub">Weekly and monthly rollups from your food, weight, and workout logs. Targets shown reflect your current Settings.</p>
    <div class="panel">
      <div class="panel-title">Weekly (most recent ${weekly.length} week${weekly.length===1?'':'s'} with data)</div>
      ${trendsTable(weekly, weekLabel, targets)}
    </div>
    <div class="panel">
      <div class="panel-title">Monthly</div>
      ${trendsTable(monthly, monthLabel, targets)}
    </div>
  `;
}

/* ===================== SETTINGS ===================== */
function viewSettings(){
  const p = STATE.profile;
  if(settingsPhase === null) settingsPhase = p.phase;
  const previewProfile = {...p, phase: settingsPhase};
  const t = computeTargets(previewProfile);
  return `
    <h1 class="pagehead">Settings</h1>
    <p class="pagesub">These numbers drive your daily targets on the Dashboard.</p>

    <div class="panel">
      <div class="panel-title">Profile</div>
      <div class="fieldgrid3">
        <div class="fieldrow"><label>Sex</label>
          <select id="sSex">
            <option value="male" ${p.sex==='male'?'selected':''}>Male</option>
            <option value="female" ${p.sex==='female'?'selected':''}>Female</option>
          </select>
        </div>
        <div class="fieldrow"><label>Age</label><input type="number" id="sAge" value="${p.age}"></div>
        <div class="fieldrow"><label>Weight (lb)</label><input type="number" step="0.1" id="sWeight" value="${p.weightLbs}"></div>
      </div>
      <div class="fieldgrid3">
        <div class="fieldrow"><label>Height — feet</label><input type="number" id="sHft" value="${p.heightFt}"></div>
        <div class="fieldrow"><label>Height — inches</label><input type="number" id="sHin" value="${p.heightIn}"></div>
        <div class="fieldrow"><label>Activity outside lifting</label>
          <select id="sActivity">
            ${Object.keys(ACTIVITY_MULT).map(k=>`<option value="${k}" ${p.activity===k?'selected':''}>${k.charAt(0).toUpperCase()+k.slice(1)}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Training experience &amp; phase</div>
      <div class="fieldgrid">
        <div class="fieldrow"><label>Training experience</label>
          <select id="sExperience">
            ${Object.keys(RATE_BANDS).map(k=>`<option value="${k}" ${p.experience===k?'selected':''}>${RATE_BANDS[k].label}</option>`).join('')}
          </select>
        </div>
        <div class="fieldrow"><label>Phase</label>
          <select id="sPhase">
            <option value="bulk" ${settingsPhase==='bulk'?'selected':''}>Bulk (surplus)</option>
            <option value="minicut" ${settingsPhase==='minicut'?'selected':''}>Mini-cut (short deficit)</option>
          </select>
        </div>
      </div>
      <div class="notebox" style="margin-top:0;">This sets the rate-of-gain target the Dashboard checks your weight trend against — ${RATE_BANDS[p.experience].min}–${RATE_BANDS[p.experience].max}% bodyweight/month for a bulk at your experience level.</div>
    </div>

    <div class="panel">
      <div class="panel-title">${settingsPhase==='minicut' ? 'Mini-cut parameters' : 'Bulk parameters'}</div>
      <div class="fieldgrid3">
        ${settingsPhase==='minicut'
          ? `<div class="fieldrow"><label>Deficit (% below maintenance)</label><input type="number" step="0.5" id="sDeficitPct" value="${p.deficitPct}"></div>`
          : `<div class="fieldrow"><label>Surplus (% above maintenance)</label><input type="number" step="0.5" id="sSurplusPct" value="${p.surplusPct}"></div>`}
        <div class="fieldrow"><label>Protein (g / lb bodyweight)</label><input type="number" step="0.05" id="sProtein" value="${p.proteinPerLb}"></div>
        <div class="fieldrow"><label>Fat (% of calories)</label><input type="number" step="1" id="sFatPct" value="${p.fatPct}"></div>
      </div>
      <div class="notebox" style="margin-top:4px;">Following Jeff Nippard's framework from <i>How To Bulk Like A Pro</i>: a 5–10% surplus above maintenance, 0.7–1g protein per lb bodyweight, and fat at 20–30% of calories — sized to build muscle without excess fat, with periodic mini-cuts (~20–25% deficit, 4–6 weeks) if a long bulk starts adding more fat than you want. The beginner/intermediate rate-of-gain bands above are his; the advanced band is my extrapolation, not a figure he stated directly.</div>
    </div>

    <div class="panel">
      <div class="panel-title">Calculated targets</div>
      <div class="statgrid">
        <div class="statbox"><div class="k">BMR</div><div class="v">${fmt(t.bmr)}</div></div>
        <div class="statbox"><div class="k">TDEE</div><div class="v">${fmt(t.tdee)}</div></div>
        <div class="statbox"><div class="k">Target calories</div><div class="v">${fmt(t.calories)}</div></div>
        <div class="statbox"><div class="k">Protein</div><div class="v">${fmt(t.proteinG)}g</div></div>
        <div class="statbox"><div class="k">Carbs</div><div class="v">${fmt(t.carbsG)}g</div></div>
        <div class="statbox"><div class="k">Fat</div><div class="v">${fmt(t.fatG)}g</div></div>
      </div>
    </div>

    <div class="btnrow">
      <button class="primary" id="btnSaveProfile">Save settings</button>
    </div>

    <div class="panel" style="margin-top:24px;">
      <div class="panel-title">Data</div>
      <p style="font-size:13px; color:var(--text-dim); margin-top:0;">Your data is stored privately in this browser (localStorage) and isn't sent anywhere except the macro-estimate calls to the server. Show a backup below and copy it somewhere safe (e.g. paste into Notes) — clearing browser data or switching devices will lose it otherwise.</p>
      <div class="btnrow">
        <button id="btnExport">Show backup text</button>
        <button class="danger" id="btnReset">Reset all data</button>
      </div>
      <div id="exportArea"></div>
    </div>
  `;
}

function bindSettingsEvents(){
  const phaseSel = document.getElementById('sPhase');
  if(phaseSel) phaseSel.addEventListener('change', ()=>{
    settingsPhase = phaseSel.value;
    renderMain();
  });
  const save = document.getElementById('btnSaveProfile');
  if(save) save.addEventListener('click', async ()=>{
    const phase = document.getElementById('sPhase').value;
    STATE.profile = {
      sex: document.getElementById('sSex').value,
      age: Number(document.getElementById('sAge').value)||25,
      weightLbs: Number(document.getElementById('sWeight').value)||185,
      heightFt: Number(document.getElementById('sHft').value)||5,
      heightIn: Number(document.getElementById('sHin').value)||10,
      activity: document.getElementById('sActivity').value,
      experience: document.getElementById('sExperience').value,
      phase: phase,
      surplusPct: phase==='bulk' ? (Number(document.getElementById('sSurplusPct')?.value)||7.5) : STATE.profile.surplusPct,
      deficitPct: phase==='minicut' ? (Number(document.getElementById('sDeficitPct')?.value)||20) : STATE.profile.deficitPct,
      proteinPerLb: Number(document.getElementById('sProtein').value)||0.85,
      fatPct: Number(document.getElementById('sFatPct').value)||25,
    };
    settingsPhase = null;
    await saveProfile();
    renderMain();
  });
  const exp = document.getElementById('btnExport');
  if(exp) exp.addEventListener('click', ()=>{
    const json = JSON.stringify({profile:STATE.profile, foodLogs:STATE.foodLogs, weightLogs:STATE.weightLogs, workoutLogs:STATE.workoutLogs}, null, 2);
    const area = document.getElementById('exportArea');
    area.innerHTML = `
      <div class="fieldrow" style="margin-top:14px;">
        <label>Tap inside the box, then Select All &amp; Copy, then paste it somewhere safe</label>
        <textarea id="exportText" readonly style="min-height:160px; font-family:'Roboto Mono',monospace; font-size:11px;"></textarea>
      </div>
      <div class="btnrow"><button class="small" id="btnSelectExport">Select all</button></div>
    `;
    document.getElementById('exportText').value = json;
    document.getElementById('btnSelectExport').addEventListener('click', ()=>{
      const ta = document.getElementById('exportText');
      ta.focus();
      ta.setSelectionRange(0, ta.value.length);
    });
  });
  const reset = document.getElementById('btnReset');
  if(reset) reset.addEventListener('click', async ()=>{
    if(!confirm('This clears all food, weight, and workout logs from this app. Continue?')) return;
    STATE.foodLogs = []; STATE.weightLogs = []; STATE.workoutLogs = [];
    await Promise.all([saveFoodLogs(), saveWeightLogs(), saveWorkoutLogs()]);
    renderMain();
  });
}

/* ===================== EVENT BINDING ===================== */
function bindTabEvents(){
  if(STATE.tab==='food') bindFoodEvents();
  else if(STATE.tab==='weight') bindWeightEvents();
  else if(STATE.tab==='workouts') bindWorkoutEvents();
  else if(STATE.tab==='settings') bindSettingsEvents();
}

/* ===================== INIT ===================== */
(async function init(){
  document.getElementById('app').innerHTML = '<div style="padding:40px; color:#888;">Loading...</div>';
  await loadAll();
  render();
})();
</script>
</body>
</html>
